name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Commit calendar diagram (private contributions included via STATS_TOKEN)
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.STATS_TOKEN }}
          user: mhmdrojil
          filename: metrics.commits.svg
          output_action: none
          base: ""
          config_timezone: Asia/Makassar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Move rendered calendar into repo
        run: sudo mv /metrics_renders/metrics.commits.svg . && sudo chown "$USER" metrics.commits.svg

      - run: python scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit changes
        run: |
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GitHub stats"
          git push
